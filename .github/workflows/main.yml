name: Release Bin Folder

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release wof-utilization-mcp-server/wof-utilization-mcp-server.csproj

      - name: Test
        run: dotnet test --configuration Release

      - name: Zip Bin Folder
        run: |
          cd wof-utilization-mcp-server/bin/Release
          zip -r ../../../release.zip *

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          files: release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}